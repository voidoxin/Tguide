    value: "Nmap (Network Mapper) est un utilitaire libre et open-source pour la découverte de réseau et l'audit de sécurité. Il utilise des paquets IP bruts pour déterminer quels hôtes sont disponibles sur le réseau, quels services ils offrent, quels systèmes d'exploitation ils exécutent, et bien d'autres caractéristiques."
