templates:
  # ── nmap templates ──
  - tool_name: "nmap"
    template_name: "Quick TCP Scan"
    description: "Scans top 1000 TCP ports on a target host with service detection"
    root: false
    protocols: "tcp"
    flag: true
  - tool_name: "nmap"
    template_name: "Full Port Scan"
    description: "Scans all 65535 TCP ports with OS and version detection (aggressive)"
    root: true
    protocols: "tcp"
    flag: true
  - tool_name: "nmap"
    template_name: "UDP Scan"
    description: "Scans top UDP ports for services like DNS, SNMP, and DHCP"
    root: true
    protocols: "udp"
    flag: true

  # ── netcat templates ──
  - tool_name: "netcat"
    template_name: "Banner Grab"
    description: "Connects to a target port and reads the service banner"
    root: false
    protocols: "tcp"
    flag: true
  - tool_name: "netcat"
    template_name: "Reverse Shell Listener"
    description: "Creates a listening port for incoming reverse shell connections"
    root: false
    protocols: "tcp"
    flag: true
  - tool_name: "netcat"
    template_name: "Port Scan"
    description: "TCP port scan across a range of ports on a target"
    root: false
    protocols: "tcp"
    flag: true

  # ── sqlmap templates ──
  - tool_name: "sqlmap"
    template_name: "Database Enumeration"
    description: "Enumerate all databases on the target SQL server"
    root: false
    protocols: "http,https"
    flag: true
  - tool_name: "sqlmap"
    template_name: "Table Dump"
    description: "Dump all entries from a specific database table"
    root: false
    protocols: "http,https"
    flag: true

  # ── metasploit templates ──
  - tool_name: "metasploit"
    template_name: "Launch Console"
    description: "Start Metasploit Framework console with quiet mode"
    root: false
    protocols: ""
    flag: false
  - tool_name: "metasploit"
    template_name: "Run Resource Script"
    description: "Run an automated resource script in Metasploit"
    root: false
    protocols: ""
    flag: true

  # ── hydra templates ──
  - tool_name: "hydra"
    template_name: "SSH Bruteforce"
    description: "Brute force SSH login using a username and password list"
    root: false
    protocols: "tcp"
    flag: true
  - tool_name: "hydra"
    template_name: "HTTP Form Bruteforce"
    description: "Brute force HTTP POST form authentication"
    root: false
    protocols: "http,https"
    flag: true

  # ── aircrack-ng templates ──
  - tool_name: "aircrack-ng"
    template_name: "WPA PSK Crack"
    description: "Crack WPA/WPA2 PSK using a dictionary wordlist"
    root: false
    protocols: ""
    flag: true
  - tool_name: "aircrack-ng"
    template_name: "WEP Crack (KoreK)"
    description: "Crack WEP keys using KoreK attacks with captured IVs"
    root: false
    protocols: ""
    flag: true

  # ── wireshark templates ──
  - tool_name: "wireshark"
    template_name: "Live Capture"
    description: "Start live packet capture on a specific interface"
    root: true
    protocols: "all"
    flag: true
  - tool_name: "wireshark"
    template_name: "Analyze PCAP"
    description: "Open and analyze an existing packet capture file"
    root: false
    protocols: ""
    flag: true

  # ── john templates ──
  - tool_name: "john"
    template_name: "Dictionary Attack"
    description: "Crack password hashes using a wordlist with rules"
    root: false
    protocols: ""
    flag: true
  - tool_name: "john"
    template_name: "Show Cracked"
    description: "Display all previously cracked password hashes"
    root: false
    protocols: ""
    flag: false